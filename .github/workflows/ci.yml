name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript check
        run: yarn tsc --noEmit

      # Circuit soundness + decoder tests (synthetic keys only; needs the committed artifacts)
      - name: Run tests
        run: yarn test

  noir:
    name: Noir circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned release binary. noir-lang/noirup@v0.1.3 finished without putting nargo on PATH
      # for rc.3 ("nargo: command not found").
      - name: Install Nargo 1.0.0-rc.3
        run: |
          mkdir -p "$RUNNER_TEMP/nargo"
          curl -fsSL https://github.com/noir-lang/noir/releases/download/v1.0.0-rc.3/noir-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$RUNNER_TEMP/nargo"
          echo "$RUNNER_TEMP/nargo" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nargo/nargo" --version

      # Vendored zkemail.nr suite (DKIM, tamper, redc-binding incl. the top-limb range check).
      # REASON: run from a copy. Inside src/circuit/vendor, nargo resolves the parent email_mask
      # package ("Selected package `email_mask` was not found").
      - name: nargo test (vendored zkemail.nr)
        run: |
          cp -r src/circuit/vendor "$RUNNER_TEMP/vendor"
          cd "$RUNNER_TEMP/vendor/zkemail" && nargo test
